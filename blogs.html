<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6110723458840814"
        crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Student Education Portal</title>
    <meta name="description" content="Study tips, exam updates and career guidance articles from Knowledge Hunt.">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/header.css?v=20261105" rel="stylesheet">
    <link href="css/footer.css?v=20261105" rel="stylesheet">
    <link href="css/main.css?v=20261105" rel="stylesheet">
    <link href="css/blog.css?v=20261105" rel="stylesheet">
</head>

<body class="blogs-page">
    <div id="header-container"></div>

    <section class="hero-section blogs-hero">
        <div class="container">
            <h1 class="hero-title">Knowledge Hunt Blog</h1>
            <p class="hero-description">Study tips, exam updates and career guidance to help students prepare smarter.</p>
            <div class="blog-search" role="search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="search" id="searchInput" placeholder="Search articles..." aria-label="Search blogs" autocomplete="off">
            </div>
        </div>
    </section>

    <main class="container blogs-main">
        <section id="featuredBlog" class="blogs-featured" aria-label="Featured article"></section>

        <div class="blog-chips" id="categoryChips" role="group" aria-label="Filter by category"></div>

        <div class="bc-grid" id="blogGrid" aria-live="polite" aria-busy="true"></div>

        <nav class="blog-pagination" id="pagination" aria-label="Blog pages"></nav>
    </main>

    <div id="footer-container"></div>

    <script src="js/blog-cards.js?v=20261105"></script>
    <script>
        const API_BASE = location.hostname === "localhost"
            ? "http://localhost:5000"
            : "https://student-education-portal-backend.onrender.com";
        const { el } = BlogCards;
        let currentPage = 1;
        let totalPages = 1;
        let currentCategory = new URLSearchParams(location.search).get('category') || "all";
        let currentSearch = "";
        let featuredSlug = null;
        let requestId = 0;

        const filtered = () => currentCategory !== 'all' || currentSearch !== '';

        function stateBox(icon, title, text, action) {
            const box = el('div', 'blog-state');
            const i = el('i', 'fas ' + icon);
            i.setAttribute('aria-hidden', 'true');
            box.append(i, el('h3', '', title), el('p', '', text));
            if (action) box.appendChild(action);
            return box;
        }

        function actionButton(label, onClick) {
            const btn = el('button', 'bl-btn', label);
            btn.type = 'button';
            btn.onclick = onClick;
            return btn;
        }

        function clearFilters() {
            currentSearch = '';
            document.getElementById('searchInput').value = '';
            setCategory('all');
        }

        async function loadFeatured() {
            const box = document.getElementById('featuredBlog');
            box.replaceChildren(...BlogCards.skeleton(1, 'bc-featured'));
            try {
                const res = await fetch(API_BASE + '/api/blogs/featured');
                const data = await res.json();
                if (!data.success || !data.blog) { box.replaceChildren(); return; }
                featuredSlug = data.blog.slug;
                box.replaceChildren(BlogCards.featured(data.blog));
            } catch (err) {
                console.error("Featured error:", err);
                box.replaceChildren();
            }
        }

        async function loadBlogs(page = 1) {
            const grid = document.getElementById('blogGrid');
            const id = ++requestId; // ignore answers that arrive after a newer search
            grid.setAttribute('aria-busy', 'true');
            grid.replaceChildren(...BlogCards.skeleton(6));
            document.getElementById('featuredBlog').hidden = filtered();
            const params = new URLSearchParams({ page, category: currentCategory, search: currentSearch });
            try {
                const res = await fetch(API_BASE + '/api/blogs?' + params);
                const data = await res.json();
                if (id !== requestId) return;

                if (!data.success || !data.blogs || data.blogs.length === 0) {
                    grid.replaceChildren(stateBox('fa-search', 'No articles found',
                        filtered() ? 'Try another word or category.' : 'New articles are on the way. Check back soon!',
                        filtered() ? actionButton('Clear filters', clearFilters) : null));
                    document.getElementById('pagination').replaceChildren();
                    return;
                }

                currentPage = data.currentPage;
                totalPages = data.totalPages;

                // The featured article is already shown big above the grid on the unfiltered first page.
                const featuredShown = !filtered() && currentPage === 1 && featuredSlug;
                const blogs = featuredShown ? data.blogs.filter(b => b.slug !== featuredSlug) : data.blogs;
                grid.replaceChildren(...blogs.map(BlogCards.card));
                renderPagination();
            } catch (err) {
                if (id !== requestId) return;
                console.error("Load error:", err);
                grid.replaceChildren(stateBox('fa-wifi', "Couldn't load articles", 'Please check your connection and try again.',
                    actionButton('Try again', () => loadBlogs(currentPage))));
                document.getElementById('pagination').replaceChildren();
            } finally {
                if (id === requestId) grid.setAttribute('aria-busy', 'false');
            }
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.blog-chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.cat === cat)));
            loadBlogs(1);
        }

        function renderChips(categories) {
            const chips = ['all', ...categories].map(cat => {
                const chip = el('button', 'blog-chip', cat === 'all' ? 'All' : cat);
                chip.type = 'button';
                chip.dataset.cat = cat;
                chip.setAttribute('aria-pressed', String(cat === currentCategory));
                chip.onclick = () => setCategory(cat);
                return chip;
            });
            document.getElementById('categoryChips').replaceChildren(...chips);
        }

        async function loadCategories() {
            renderChips([]);
            try {
                const res = await fetch(API_BASE + '/api/blogs/categories');
                const data = await res.json();
                if (data.success) renderChips(data.categories);
            } catch (err) {
                console.error("Categories error:", err);
            }
        }

        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentSearch = e.target.value.trim();
                loadBlogs(1);
            }, 400);
        });

        function pageButton(label, page, active, ariaLabel) {
            const btn = el('button', active ? 'active' : '', label);
            btn.type = 'button';
            if (ariaLabel) btn.setAttribute('aria-label', ariaLabel);
            if (page && !active) btn.onclick = () => {
                loadBlogs(page);
                document.getElementById('categoryChips').scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
            else btn.disabled = !active;
            if (active) btn.setAttribute('aria-current', 'page');
            return btn;
        }

        function renderPagination() {
            const buttons = [];
            if (currentPage > 1) buttons.push(pageButton('← Previous', currentPage - 1, false, 'Previous page'));
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) buttons.push(pageButton(String(i), i, i === currentPage, 'Page ' + i));
                else if (Math.abs(i - currentPage) === 3) buttons.push(pageButton('…'));
            }
            if (currentPage < totalPages) buttons.push(pageButton('Next →', currentPage + 1, false, 'Next page'));
            document.getElementById('pagination').replaceChildren(...(totalPages > 1 ? buttons : []));
        }

        loadCategories();
        document.getElementById('blogGrid').replaceChildren(...BlogCards.skeleton(6));
        // Grid waits for the featured slug so the same article is not shown twice.
        loadFeatured().finally(() => loadBlogs());
    </script>
    <script src="js/load-components.js?v=20261105"></script>
</body>

</html>
