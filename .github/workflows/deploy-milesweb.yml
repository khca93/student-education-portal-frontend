
name: Deploy frontend to MilesWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milesweb-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to MilesWeb
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::FTP credentials are missing."
            exit 1
          fi

          if [[ "$FTP_SERVER" == *"/"* ]]; then
            echo "::error::FTP_SERVER must contain hostname only."
            exit 1
          fi

          echo "FTP configuration validated."

      - name: Upload frontend files
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import quote

          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          # FTP account root is assumed to be /exampaper
          remote_dir = "."

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          excluded_dirs = (
              ".github/",
              "uploads/",
              "node_modules/",
              "dist/",
              "build/",
              "coverage/",
          )

          excluded_suffixes = (
              ".zip", ".tar", ".tar.gz",
              ".7z", ".pdf", ".log"
          )

          uploaded = 0

          for path in filter(None, tracked):

              normalized = path.replace("\\", "/")
              lower = normalized.lower()
              filename = lower.rsplit("/", 1)[-1]

              if normalized == ".gitignore":
                  continue

              if normalized.startswith(excluded_dirs):
                  continue

              if (filename == ".env"
                  or filename.startswith(".env.")
                  or filename.endswith(".env")):
                  continue

              if lower.endswith(excluded_suffixes):
                  continue

              encoded_path = quote(normalized, safe="/")

              target = (
                  f"ftp://{server}/"
                  f"{encoded_path}"
              )

              command = [
                  "curl",
                  "--fail",
                  "--silent",
                  "--show-error",
                  "--ssl-reqd",
                  "--ftp-create-dirs",
                  "--user",
                  f"{username}:{password}",
                  "--upload-file",
                  path,
                  target,
              ]

              print(f"Uploading: {normalized}")

              subprocess.run(command, check=True)

              uploaded += 1

          print(f"Deployment successful. Files uploaded: {uploaded}")
          print("No remote files were deleted.")
          PY
