name: Deploy frontend to MilesWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milesweb-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to /exampaper
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          [[ -n "$FTP_HOST" ]] || {
            echo "::error::FTP_SERVER is missing"
            exit 1
          }

          [[ -n "$FTP_USERNAME" ]] || {
            echo "::error::FTP_USERNAME is missing"
            exit 1
          }

          [[ -n "$FTP_PASSWORD" ]] || {
            echo "::error::FTP_PASSWORD is missing"
            exit 1
          }

          [[ "$REMOTE_DIR" == "." ]] || {
            echo "::error::FTP_SERVER_DIR must be ."
            exit 1
          }

          echo "FTP configuration validated."

      - name: Upload frontend using FTP
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'PY'
          import os
          import ftplib
          import subprocess
          import posixpath

          host = os.environ["FTP_HOST"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          remote_root = os.environ["REMOTE_DIR"]

          if remote_root != ".":
              raise ValueError("Remote directory must be .")

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          excluded_dirs = (
              ".git/",
              ".github/",
              "node_modules/",
              "dist/",
              "build/",
              "coverage/",
              "uploads/",
          )

          excluded_suffixes = (
              ".zip",
              ".tar",
              ".tar.gz",
              ".7z",
              ".pdf",
              ".log",
          )

          files = []

          for path in filter(None, tracked):
              normalized = path.replace("\\", "/")
              lower = normalized.lower()
              filename = lower.rsplit("/", 1)[-1]

              if normalized == ".gitignore":
                  continue

              if normalized.startswith(excluded_dirs):
                  continue

              if (
                  filename == ".env"
                  or filename.startswith(".env.")
                  or filename.endswith(".env")
              ):
                  continue

              if lower.endswith(excluded_suffixes):
                  continue

              if os.path.islink(path):
                  continue

              if os.path.isfile(path):
                  files.append(normalized)

          if not files:
              raise RuntimeError("No tracked frontend files found.")

          ftp = ftplib.FTP()

          try:
              print(f"Connecting to FTP host: {host}")

              ftp.connect(host, 21, timeout=60)
              ftp.login(username, password)
              ftp.set_pasv(True)

              print("FTP login successful.")

              ftp.cwd(remote_root)

              # Login nantar jo folder milto (/exampaper) to base mhanun lakshat theva
              remote_base = ftp.pwd()
              print(f"FTP base directory: {remote_base}")

              def ensure_remote_dir(relative_dir):
                  # Pratyek file adhi base folder la parat ja
                  ftp.cwd(remote_base)

                  if not relative_dir or relative_dir == ".":
                      return

                  for part in relative_dir.split("/"):
                      if not part or part == ".":
                          continue

                      if part == "..":
                          raise ValueError("Unsafe remote path")

                      try:
                          ftp.cwd(part)
                      except ftplib.error_perm:
                          ftp.mkd(part)
                          ftp.cwd(part)

              uploaded = 0

              for local_path in files:
                  remote_parent = posixpath.dirname(local_path)
                  filename = posixpath.basename(local_path)

                  ensure_remote_dir(remote_parent)

                  with open(local_path, "rb") as file_handle:
                      ftp.storbinary(
                          f"STOR {filename}",
                          file_handle
                      )

                  uploaded += 1
                  print(f"Uploaded: {local_path}")

              print("--------------------------------")
              print("FTP deployment completed.")
              print(f"Destination: {remote_base}")
              print(f"Files uploaded: {uploaded}")
              print("Remote files were not deleted.")
              print("--------------------------------")

          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          PY
