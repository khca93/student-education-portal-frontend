
name: Deploy frontend to MilesWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milesweb-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to /exampaper
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SFTP configuration
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          [[ -n "$SFTP_HOST" ]] || {
            echo "::error::FTP_SERVER is missing"
            exit 1
          }

          [[ -n "$SFTP_USERNAME" ]] || {
            echo "::error::FTP_USERNAME is missing"
            exit 1
          }

          [[ -n "$SFTP_PASSWORD" ]] || {
            echo "::error::FTP_PASSWORD is missing"
            exit 1
          }

          [[ -n "$REMOTE_DIR" ]] || {
            echo "::error::FTP_SERVER_DIR is missing"
            exit 1
          }

          if [[ "$REMOTE_DIR" == /* ||
                "$REMOTE_DIR" == *\\* ||
                "/$REMOTE_DIR/" == *"/../"* ]]; then
            echo "::error::Remote directory must be a safe relative path"
            exit 1
          fi

          echo "SFTP configuration validated."

      - name: Install SFTP dependency
        run: |
          python3 -m pip install --disable-pip-version-check paramiko

      - name: Upload frontend using SFTP
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'PY'
          import os
          import stat
          import posixpath
          import paramiko
          import subprocess

          host = os.environ["SFTP_HOST"]
          username = os.environ["SFTP_USERNAME"]
          password = os.environ["SFTP_PASSWORD"]
          remote_root = os.environ["REMOTE_DIR"].strip("/")

          if not remote_root:
              raise ValueError("Remote directory cannot be empty")

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          excluded_dirs = (
              ".git/",
              ".github/",
              "node_modules/",
              "dist/",
              "build/",
              "coverage/",
              "uploads/",
          )

          excluded_suffixes = (
              ".zip",
              ".tar",
              ".tar.gz",
              ".7z",
              ".pdf",
              ".log",
          )

          files = []

          for path in filter(None, tracked):
              normalized = path.replace("\\", "/")
              lower = normalized.lower()
              name = lower.rsplit("/", 1)[-1]

              if normalized == ".gitignore":
                  continue

              if normalized.startswith(excluded_dirs):
                  continue

              if name == ".env" or name.startswith(".env.") or name.endswith(".env"):
                  continue

              if lower.endswith(excluded_suffixes):
                  continue

              if os.path.islink(path):
                  continue

              if os.path.isfile(path):
                  files.append(normalized)

          transport = None
          sftp = None

          try:
              transport = paramiko.Transport((host, 22))
              transport.connect(
                  username=username,
                  password=password
              )

              sftp = paramiko.SFTPClient.from_transport(transport)

              def ensure_remote_dir(path):
                  current = ""

                  for part in path.split("/"):
                      if not part or part == ".":
                          continue

                      if part == "..":
                          raise ValueError("Unsafe remote path")

                      current = posixpath.join(current, part)

                      try:
                          sftp.stat(current)
                      except FileNotFoundError:
                          sftp.mkdir(current)

              ensure_remote_dir(remote_root)

              uploaded = 0

              for local_path in files:
                  remote_path = posixpath.join(
                      remote_root,
                      local_path
                  )

                  remote_parent = posixpath.dirname(remote_path)

                  ensure_remote_dir(remote_parent)

                  sftp.put(local_path, remote_path)

                  uploaded += 1
                  print(f"Uploaded: {local_path}")

              print("--------------------------------")
              print("SFTP deployment completed.")
              print(f"Destination: {remote_root}")
              print(f"Files uploaded: {uploaded}")
              print("No remote files were deleted.")
              print("--------------------------------")

          finally:
              if sftp:
                  sftp.close()

              if transport:
                  transport.close()
          PY
