
name: Deploy frontend to MilesWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milesweb-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload frontend files
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Validate FTP configuration
        shell: bash
        env:
         FTP_SERVER: ${{ secrets.FTP_SERVER }}
         FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
         FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
         FTP_PROTOCOL: ${{ secrets.MILESWEB_FTP_PROTOCOL }}
         FTP_SERVER_DIR: ${{ secrets.MILESWEB_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::FTP credentials are missing."
            exit 1
          fi

          if [[ "$FTP_PROTOCOL" != "ftpes" ]]; then
            echo "::error::Set MILESWEB_FTP_PROTOCOL to ftpes for port 21."
            exit 1
          fi

          if [[ -z "$FTP_SERVER_DIR" ]]; then
            echo "::error::FTP directory is missing."
            exit 1
          fi

          if [[ "$FTP_SERVER_DIR" == /* || "$FTP_SERVER_DIR" == *"\\"* ]]; then
            echo "::error::FTP directory must be relative."
            exit 1
          fi

          if [[ "/$FTP_SERVER_DIR/" == *"/../"* ]]; then
            echo "::error::Parent directory segments are not allowed."
            exit 1
          fi

          echo "FTP configuration validated."

      - name: Upload frontend files to MilesWeb
        shell: bash
        env:
           FTP_SERVER: ${{ secrets.FTP_SERVER }}
           FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
           FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
           FTP_SERVER_DIR: ${{ secrets.MILESWEB_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import quote

          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          remote_dir = os.environ["FTP_SERVER_DIR"].strip("/")

          if remote_dir == ".":
              remote_dir = ""

          encoded_dir = "/".join(
              quote(part, safe="")
              for part in remote_dir.split("/")
              if part
          )

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          excluded_dirs = (
              ".github/",
              "uploads/",
              "node_modules/",
              "dist/",
              "build/",
              "coverage/",
          )

          excluded_suffixes = (
              ".zip",
              ".tar",
              ".tar.gz",
              ".7z",
              ".pdf",
              ".log",
          )

          uploaded = 0

          for path in filter(None, tracked):

              normalized = path.replace("\\", "/")
              lower = normalized.lower()
              filename = lower.rsplit("/", 1)[-1]

              if normalized == ".gitignore":
                  continue

              if normalized.startswith(excluded_dirs):
                  continue

              if filename == ".env" or filename.startswith(".env.") or filename.endswith(".env"):
                  continue

              if lower.endswith(excluded_suffixes):
                  continue

              encoded_path = quote(normalized, safe="/")

              target_path = "/".join(
                  part for part in (encoded_dir, encoded_path)
                  if part
              )

              target = f"ftp://{server}/{target_path}"

              command = [
                  "curl",
                  "--fail",
                  "--silent",
                  "--show-error",
                  "--ssl-reqd",
                  "--ftp-create-dirs",
                  "--user",
                  f"{username}:{password}",
                  "--upload-file",
                  path,
                  target,
              ]

              subprocess.run(command, check=True)

              uploaded += 1

          print(f"Successfully uploaded {uploaded} files.")
          print("Remote files were not deleted.")
          PY
