<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6110723458840814"
    crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Education Portal Blog</title>
  <meta name="description" content="Student Education Portal Blog">

  <!-- Open Graph -->
  <meta property="og:title" id="ogTitle" content="">
  <meta property="og:description" id="ogDescription" content="">
  <meta property="og:image" id="ogImage" content="">
  <meta property="og:type" content="article">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:image:alt" id="ogImageAlt" content="">
  <link rel="canonical" id="canonicalLink" href="">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitterTitle" content="">
  <meta name="twitter:description" id="twitterDescription" content="">
  <meta name="twitter:image" id="twitterImage" content="">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/header.css" rel="stylesheet">
  <link href="css/footer.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
  <link href="css/blog.css" rel="stylesheet">

  <style>
    body { background: #f1f5f9; }
    .blog-page { padding: 40px 20px 60px; }
    .blog-container { overflow: hidden; }
    .back-link { display: inline-block; margin-bottom: 18px; color: #4f46e5; text-decoration: none; font-weight: 500; }
    .blog-category {
      display: inline-block; font-size: 12px; font-weight: 600; color: #4f46e5; background: #eef2ff;
      padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 12px;
    }
    .blog-category:empty { display: none; }
    #blogTitle { font-family: 'Poppins', sans-serif; font-size: 2rem; line-height: 1.3; color: #1e293b; }
    .meta { display: flex; flex-wrap: wrap; gap: 16px; }
    .meta i { margin-right: 5px; color: #94a3b8; }
    .main-blog-image { margin: 0; max-height: 480px; object-fit: cover; }
    .blog-content::after { content: ''; display: block; clear: both; }
    .like-section { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 30px 0; padding: 18px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
    .like-section button {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px;
      border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font: inherit; font-size: 14px;
    }
    .like-section button:hover { background: #eef2ff; border-color: #c7d2fe; }
    #likeCount { color: #64748b; font-size: 14px; margin-right: auto; }
    .section-heading { font-size: 1.3rem; color: #1e293b; margin: 30px 0 14px; }
    .single-comment { background: #f8fafc; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .single-comment small { color: #64748b; margin-left: 8px; }
    .single-comment p { margin: 6px 0 0; color: #334155; white-space: pre-line; }
    .related-card { color: inherit; text-decoration: none; display: block; }
    .related-card h4, .related-card p { padding: 0 15px; }
    .related-card h4 { margin: 12px 0 6px; color: #1e293b; }
    .related-card p { color: #64748b; font-size: 14px; margin-bottom: 15px; }
    .blog-error { text-align: center; padding: 40px 0; color: #64748b; }

    @media (max-width: 600px) {
      .blog-page { padding: 20px 12px 40px; }
      .blog-container { padding: 20px; }
      #blogTitle { font-size: 1.5rem; }
    }
  </style>
</head>

<body>
  <div id="header-container"></div>

  <main class="blog-page">
    <article class="blog-container" id="blogArticle">
      <a href="blogs.html" class="back-link"><i class="fas fa-arrow-left"></i> All Blogs</a>
      <div><span class="blog-category" id="blogCategory"></span></div>
      <h1 id="blogTitle">Loading…</h1>
      <p id="blogSubtitle" class="blog-subtitle" hidden></p>
      <div class="meta" id="blogMeta"></div>
      <div id="blogTags" class="blog-tag-list" aria-label="Article tags"></div>

      <!-- Blog Main Image -->
      <div id="blogImageContainer"></div>

      <!-- Blog Content -->
      <div class="content blog-content" id="blogContent"></div>

      <div class="like-section">
        <button type="button" onclick="likeBlog()"><i class="far fa-thumbs-up"></i> Like</button>
        <span id="likeCount"></span>
        <button type="button" onclick="shareWhatsApp()"><i class="fab fa-whatsapp"></i> WhatsApp</button>
        <button type="button" onclick="shareFacebook()"><i class="fab fa-facebook"></i> Facebook</button>
        <button type="button" onclick="copyLink()"><i class="fas fa-link"></i> Copy Link</button>
      </div>

      <h3 class="section-heading">Comments</h3>
      <div id="commentsContainer"></div>

      <div class="comment-form">
        <input type="text" id="commentName" placeholder="Your Name" aria-label="Your name">
        <textarea id="commentMessage" placeholder="Write your comment..." aria-label="Comment"></textarea>
        <button type="button" onclick="submitComment()">Post Comment</button>
      </div>

      <h3 class="section-heading">Related Articles</h3>
      <div id="relatedBlogs"></div>
    </article>
  </main>

  <div id="footer-container"></div>

  <script>

    const API_BASE = location.hostname === "localhost"
      ? "http://localhost:5000"
      : "https://student-education-portal-backend.onrender.com";
    let currentBlogId = null;

    function getSlug() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug');
    }

    // Show errors inside the article only, so header/footer stay.
    function showError(text) {
      const msg = document.createElement('p');
      msg.className = 'blog-error';
      msg.textContent = text + ' ';
      const back = document.createElement('a');
      back.href = 'blogs.html';
      back.textContent = 'See all blogs';
      msg.appendChild(back);
      document.getElementById('blogArticle').replaceChildren(msg);
    }

    async function loadBlog() {

      const slug = getSlug();
      if (!slug) {
        showError("Blog not found.");
        return;
      }

      try {

        const res = await fetch(API_BASE + '/api/blogs/' + encodeURIComponent(slug));
        const data = await res.json();

        if (!data.success) {
          showError("Blog not found.");
          return;
        }

        const blog = data.blog;

        // SAVE ID FOR LIKE & COMMENT
        currentBlogId = blog._id;

        // ===== SEO =====
        const plainText = blog.content.replace(/<[^>]*>/g, '');
        const description = blog.metaDescription || blog.excerpt || plainText.substring(0, 150);
        const title = blog.metaTitle || blog.title + " | Student Education Portal";
        const socialTitle = blog.socialTitle || title;
        const socialDescription = blog.socialDescription || description;
        const socialImage = blog.socialImage || blog.image || '';

        document.title = title;
        document.querySelector('meta[name="description"]').setAttribute("content", description);

        document.getElementById('ogTitle').setAttribute("content", socialTitle);
        document.getElementById('ogDescription').setAttribute("content", socialDescription);
        document.getElementById('ogUrl').setAttribute("content", window.location.href);

        document.getElementById('twitterTitle').setAttribute("content", socialTitle);
        document.getElementById('twitterDescription').setAttribute("content", socialDescription);
        document.getElementById('canonicalLink').href = blog.canonicalUrl || window.location.href;
        if (socialImage) {
          document.getElementById('ogImage').setAttribute("content", socialImage);
          document.getElementById('twitterImage').setAttribute("content", socialImage);
          document.getElementById('ogImageAlt').setAttribute("content", blog.imageAlt || blog.title || '');
        }

        if (blog.image) {
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          image.src = blog.image; image.alt = blog.imageAlt || blog.title || ''; image.className = 'main-blog-image';
          figure.appendChild(image);
          if (blog.imageCaption) { const caption = document.createElement('figcaption'); caption.textContent = blog.imageCaption; figure.appendChild(caption); }
          document.getElementById('blogImageContainer').replaceChildren(figure);
        }

        document.getElementById('blogCategory').textContent = blog.category || 'General';
        document.getElementById('blogTitle').textContent = blog.title;

        const meta = document.getElementById('blogMeta');
        const metaItem = (icon, text) => {
          const span = document.createElement('span');
          const i = document.createElement('i'); i.className = icon;
          span.append(i, text);
          return span;
        };
        meta.replaceChildren(
          ...(blog.authorName ? [metaItem('far fa-user', blog.authorName)] : []),
          metaItem('far fa-calendar', new Date(blog.publishedAt || blog.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })),
          metaItem('far fa-eye', (blog.views || 0) + ' views')
        );
        const subtitle = document.getElementById('blogSubtitle');
        subtitle.textContent = blog.subtitle || '';
        subtitle.hidden = !blog.subtitle;
        const tags = document.getElementById('blogTags');
        tags.replaceChildren();
        (blog.tags || []).forEach(tag => { const chip = document.createElement('span'); chip.className = 'blog-tag'; chip.textContent = tag; tags.appendChild(chip); });

        // LIKE COUNT SHOW
        document.getElementById('likeCount').textContent = (blog.likes || 0) + " Likes";

        // Admin-written HTML, sanitized by the API (includes allow-listed YouTube embeds).
        document.getElementById('blogContent').innerHTML = blog.content;

        renderComments(blog.comments);
        loadRelatedBlogs(blog.slug);

      } catch (err) {
        console.error("Blog load error", err);
        showError("Failed to load blog. Please try again.");
      }
    }


    // ================= LIKE =================

    async function likeBlog() {

      if (!currentBlogId) return;

      try {

        const res = await fetch(API_BASE + '/api/blogs/like/' + currentBlogId, {
          method: 'POST'
        });

        const data = await res.json();

        if (data.success) {
          document.getElementById('likeCount').textContent = data.likes + " Likes";
        }

      } catch (err) {
        console.error("Like error", err);
      }
    }


    // ================= COMMENTS =================

    // Comments are visitor input: build with textContent only, never innerHTML.
    function renderComments(comments) {

      const container = document.getElementById('commentsContainer');

      if (!comments || comments.length === 0) {
        const empty = document.createElement('p');
        empty.textContent = 'No comments yet.';
        container.replaceChildren(empty);
        return;
      }

      container.replaceChildren();
      comments.forEach(c => {
        const item = document.createElement('div'); item.className = 'single-comment';
        const name = document.createElement('strong'); name.textContent = c.name || 'Reader';
        const date = document.createElement('small'); date.textContent = new Date(c.createdAt).toLocaleDateString('en-IN');
        const message = document.createElement('p'); message.textContent = c.message || '';
        item.append(name, date, message); container.appendChild(item);
      });
    }


    // ================= RELATED =================

    async function loadRelatedBlogs(slug) {

      const container = document.getElementById('relatedBlogs');
      const none = () => { const p = document.createElement('p'); p.textContent = 'No related articles found.'; container.replaceChildren(p); };

      try {
        const res = await fetch(API_BASE + '/api/blogs/related/' + encodeURIComponent(slug));
        const data = await res.json();

        if (!data.success || data.blogs.length === 0) return none();

        const grid = document.createElement('div'); grid.className = 'related-grid';
        data.blogs.forEach(blog => {
          const card = document.createElement('a'); card.className = 'related-card'; card.href = `blog.html?slug=${encodeURIComponent(blog.slug)}`;
          if (blog.image) { const image = document.createElement('img'); image.src = blog.image; image.alt = blog.imageAlt || ''; image.className = 'related-image'; image.loading = 'lazy'; card.appendChild(image); }
          const heading = document.createElement('h4'); heading.textContent = blog.title || '';
          const text = new DOMParser().parseFromString(blog.excerpt || blog.content || '', 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
          const preview = document.createElement('p'); preview.textContent = text.substring(0, 100) + '…';
          card.append(heading, preview); grid.appendChild(card);
        });
        container.replaceChildren(grid);
      } catch (err) {
        console.error("Related error", err);
        none();
      }
    }

    loadBlog();
    async function submitComment() {

      const name = document.getElementById('commentName').value.trim();
      const message = document.getElementById('commentMessage').value.trim();

      if (!name || !message) {
        alert("Name and message required");
        return;
      }

      try {

        const res = await fetch(API_BASE + '/api/blogs/comment/' + currentBlogId, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, message })
        });

        const data = await res.json();

        if (data.success) {
          renderComments(data.comments);
          document.getElementById('commentName').value = '';
          document.getElementById('commentMessage').value = '';
        }

      } catch (err) {
        alert("Failed to post comment");
      }
    }

    function shareWhatsApp() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://wa.me/?text=${url}`, '_blank');
    }

    function shareFacebook() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied!");
    }

  </script>
  <script src="js/load-components.js"></script>
</body>

</html>
